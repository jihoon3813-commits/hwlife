name: Build Hyowon SMS Bridge APK

on:
  push:
    branches:
      - main
    paths:
      - "android-sms-bridge/**"
      - ".github/workflows/build-sms-bridge-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/hyowon-release.jks" \
            -alias hyowon \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass hyowon1234 \
            -keypass hyowon1234 \
            -dname "CN=Hyowon, OU=IT, O=LifeNJoy, L=Hanam, S=Gyeonggi, C=KR"

      - name: Build signed Release APK
        working-directory: android-sms-bridge
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/hyowon-release.jks
          KEYSTORE_PASSWORD: hyowon1234
          KEY_ALIAS: hyowon
          KEY_PASSWORD: hyowon1234
        run: |
          gradle assembleRelease --no-daemon
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Built APK: $APK_FILE"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/hyowon-sms-bridge.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyowon-sms-bridge-apk
          path: hyowon-sms-bridge.apk

      - name: Publish APK to GitHub Releases (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view sms-bridge-latest >/dev/null 2>&1; then
            gh release upload sms-bridge-latest hyowon-sms-bridge.apk --clobber
          else
            gh release create sms-bridge-latest hyowon-sms-bridge.apk \
              --title "효원 문자연동 안드로이드 앱 (v1.0.0)" \
              --notes "회사 안드로이드폰에 설치하여 효원 어드민과 양방향 문자를 실시간 동기화하는 전용 앱입니다." \
              --latest
          fi
